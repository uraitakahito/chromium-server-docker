ignored:
  # DL3008 は、apt の package の全部に版を求める。版は別の形で固定している:
  # apt は全部の package を APT_SNAPSHOT の時点の snapshot.debian.org から読み、
  # chromium・chromium-common・chromium-sandbox は CHROMIUM_VERSION の版で名指す
  # （docker/Dockerfile、docs: configuration/chromium-version）。
  # ほかの package まで名指すと、上げるたびに変える行が増えるだけで、固定は何も強くならない。
  - DL3008
  # `cd && git clone && cd && git checkout` は、意図した形。
  # commit を固定して外部のリポジトリを clone するためで、WORKDIR にすると layer が細切れになる。
  - DL3003

