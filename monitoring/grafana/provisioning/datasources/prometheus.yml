# Prometheus の URL は意図してこのファイルに書き、compose の environment: には書かない ——
# container-compose は、service 名と同じ環境変数の値を IP に書き換えることがある。
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus.chromium-server:9090
    isDefault: true
    editable: false
