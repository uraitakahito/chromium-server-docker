# chromium-server の開発スタック（docker-compose.yml）の Prometheus。
# target は、この compose project の <service>.chromium-server の名前。
#
# chromium-* の job では、`instance` はどれも口を外したコンテナの名前（chromium.chromium-server）。
# だから 1 つのコンテナの node・process・cdp の series で同じ値になる。
# dashboard の $instance の変数と rule の summary が、これに頼る。
# chromium.json と rules/chromium.yml を使い回す下流のスタックは、
# 同じように relabel しなければならない。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # chromium のコンテナの VM / OS の値（node_exporter。collector は 6 つ）。
  - job_name: chromium-node
    static_configs:
      - targets: ["chromium.chromium-server:9100"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+)(?::[0-9]+)?"
        target_label: instance

  # process の群ごとの値（process-exporter。chromium の --type で群に分ける）。
  - job_name: chromium-process
    static_configs:
      - targets: ["chromium.chromium-server:9256"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+)(?::[0-9]+)?"
        target_label: instance

  # blackbox 越しの CDP の生死: GET /json/version が 2xx を返さなければならない。
  - job_name: chromium-cdp
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://chromium.chromium-server:9222/json/version"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: "https?://([^:/]+).*"
        target_label: instance
      - target_label: __address__
        replacement: blackbox.chromium-server:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
