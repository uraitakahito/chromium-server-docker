# Alert rules for the chromium containers, one evaluation per container (no rule
# aggregates across `instance`, so a stack with several containers gets one alert
# per container). Evaluated by Prometheus; there is no Alertmanager in this
# stack — the firing state is visible on http://127.0.0.1:9090/alerts and in
# Grafana's Alerting view.
groups:
  - name: chromium
    rules:
      - alert: ChromiumCdpDown
        expr: probe_success{job="chromium-cdp"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: CDP (/json/version) has not answered for 1 minute"

      - alert: ChromiumBrowserMissing
        expr: namedprocess_namegroup_num_procs{groupname="chromium-browser"} != 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }}: expected exactly one parent chromium process, found {{ $value }}"

      - alert: ChromiumExporterDown
        expr: up{job=~"chromium-(node|process)"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: {{ $labels.job }} is not answering"

      - alert: ChromiumRendererMemoryHigh
        expr: namedprocess_namegroup_memory_bytes{groupname="chromium-renderer",memtype="resident"} > 1.5e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: renderer RSS above 1.5 GB for 5 minutes"

      - alert: ChromiumVmMemoryLow
        expr: node_memory_MemAvailable_bytes{job="chromium-node"} < 512e6
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }}: less than 512 MB of memory available in the chromium VM"
