# chromium-server-docker の開発スタック（Apple Container ＋ container-compose）。
#
# 起こすのは bin/stack.sh（up | down | check | reload）。生の `container-compose` は
# 打たない —— script が preflight（道具・DNS ドメイン）を走らせ、スタックが答えるまで
# 待つ。container-compose 自身はどちらもしない。
#
# マシンごとに 1 回（sudo が要る）:
#   sudo container system dns create chromium-server
# 下の project 名がそのまま DNS ドメイン。ドメインが在れば、どの service も
# <service>.chromium-server の名前でほかのコンテナから（host からも）引ける。無いと
# container-compose は各コンテナの中の /etc/hosts を書く方式に落ち、非 root の image では
# 黙って失敗する。container_name: は書かない —— この DNS の命名が抑止される。
#
# Prometheus と Grafana の data は volume に置かず、コンテナ自身の rootfs に書く。
# このスタックは開発の動作確認用で、data は消えてよい。rootfs は container stop → start
# では残り、作り直し（container-compose up -d）と container rm で消える（2026-10-31 に実測）。
# image の既定の user（nobody・grafana）が自分の data dir を持っているので、user: も要らない
# —— named volume を使うと mount point が root 所有になり、user: "0" が要った。
# host の loopback（3000・9090・9222）にしか listen しない。exporter の口 9100 / 9256 は
# publish せず、Prometheus がコンテナ network の中で scrape する。
#
# 同時に起こすのは 1 つだけ。利用者のスタック（capture-ledger・browserhive）は自分の
# chromium を同じ loopback の口に publish する。このスタックをそれらと並べて起こさない。
# 先に他方を止める —— bin/stack.sh up は 127.0.0.1:9222 を自分以外が持っている間、
# 起動を断る。
#
# Grafana に渡す Prometheus の URL は provisioning の FILE に書く。environment: には
# 書かない —— container-compose は service 名と同じ環境変数の値を、その service の IP に
# 黙って書き換えることがある。
name: chromium-server

services:
  # このリポジトリが build する image。target: は container-compose に無視される
  # （常に最後の段を build する）が、最後の段は production なので同じ物が建つ。
  chromium:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    mem_limit: 4gb
    ports:
      - "127.0.0.1:9222:9222"   # socat 越しの CDP（bin/cdp.sh）。9100 / 9256 は publish しない。

  prometheus:
    image: docker.io/prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle        # bin/stack.sh reload → POST /-/reload
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 1gb
    depends_on:
      - chromium
      - blackbox

  grafana:
    image: docker.io/grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_DEFAULT_THEME: "system"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro   # provider の path（provisioning/dashboards/chromium.yml）
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1gb
    depends_on:
      - prometheus

  # Prometheus のために CDP（/json/version）を probe する。Apple Container は Dockerfile の
  # HEALTHCHECK を評価しないので、これが生死の合図になる。
  blackbox:
    image: docker.io/prom/blackbox-exporter:v0.29.1
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    mem_limit: 256mb
