# chromium-server-docker の開発スタック（Apple Container ＋ container-compose）。
# chromium の worker 1 台と、それを測る Prometheus・Grafana・blackbox を並べる。
#
# ── 起動 ────────────────────────────────────────────────────────────────
# リポジトリの root で打つ。生の `container-compose` は打たない —— bin/stack.sh が
# preflight（道具・DNS ドメイン・9222 の持ち主）を走らせ、スタックが答えるまで待つ。
# container-compose 自身はどちらもしない。
#
#   sudo container system dns create chromium-server   # マシンごとに 1 回だけ（sudo が要る）
#   ./bin/stack.sh up       # build → 起動 → 全部が答えるまで待つ（最大 2 分ほど）
#   ./bin/stack.sh check    # 答えているかをもう一度確かめる（--wait を付けると待つ）
#   ./bin/stack.sh reload   # Prometheus に prometheus.yml と rules を読み直させる
#   ./bin/stack.sh down     # 止める（次の up で作り直す）
#
# 起こす前に、同じ口を使うほかのスタックを止めておく（capture-ledger は pnpm run dev:down、
# browserhive は pnpm run stack:down）。
#
# ── アクセス ──────────────────────────────────────────────────────────
# Mac のブラウザから開く。どれも host の loopback（127.0.0.1）にだけ出している。
#
#   Grafana     http://127.0.0.1:3000/d/chromium     dashboard「chromium-server」。login は要らない
#                                                    （anonymous の Viewer。見るだけで編集はできない）
#   Prometheus  http://127.0.0.1:9090/targets        scrape の対象。alert は /alerts
#   CDP         http://127.0.0.1:9222/json/version   ./bin/cdp.sh がここを使う
#
# Grafana と Prometheus の data は ./bin/stack.sh up のたびに空から始まる（下の注記）。
# dashboard と datasource は monitoring/grafana/ の file から読むので、毎回同じ物が出る。
#
# ── 注記 ────────────────────────────────────────────────────────────────
# 下の project 名がそのまま DNS ドメイン（起動の 1 行目で作るもの）。ドメインが在れば、
# どの service も <service>.chromium-server の名前でほかのコンテナから（host からも）
# 引ける。無いと container-compose は各コンテナの中の /etc/hosts を書く方式に落ち、
# 非 root の image では黙って失敗する。container_name: は書かない —— この DNS の命名が
# 抑止される。
#
# Prometheus と Grafana の data は volume に置かず、コンテナ自身の rootfs に書く。
# このスタックは開発の動作確認用で、data は消えてよい。rootfs は container stop → start
# では残り、作り直し（container-compose up -d）と container rm で消える（2026-10-31 に実測）。
# image の既定の user（nobody・grafana）が自分の data dir を持っているので、user: も要らない
# —— named volume を使うと mount point が root 所有になり、user: "0" が要った。
# exporter の口 9100 / 9256 は publish せず、Prometheus がコンテナ network の中で scrape する。
#
# 同時に起こすのは 1 つだけ。利用者のスタック（capture-ledger・browserhive）は自分の
# chromium を同じ loopback の口に publish する。このスタックをそれらと並べて起こさない
# —— bin/stack.sh up は 127.0.0.1:9222 を自分以外が持っている間、起動を断る。
#
# Grafana に渡す Prometheus の URL は provisioning の FILE に書く。environment: には
# 書かない —— container-compose は service 名と同じ環境変数の値を、その service の IP に
# 黙って書き換えることがある。
name: chromium-server

services:
  # このリポジトリが build する image。target: は container-compose に無視される
  # （常に最後の段を build する）が、最後の段は production なので同じ物が建つ。
  chromium:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    mem_limit: 4gb
    ports:
      - "127.0.0.1:9222:9222"   # socat 越しの CDP（bin/cdp.sh）。9100 / 9256 は publish しない。

  prometheus:
    image: docker.io/prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle        # bin/stack.sh reload → POST /-/reload
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 1gb
    depends_on:
      - chromium
      - blackbox

  # ブラウザで http://127.0.0.1:3000/d/chromium を開く（login 不要・anonymous の Viewer）。
  # datasource は monitoring/grafana/provisioning/、dashboard は
  # monitoring/grafana/dashboards/chromium.json から読む（30 秒ごとに読み直す）。UI では保存
  # できないので、dashboard を変えるときは UI で直して JSON を export し、commit する。
  grafana:
    image: docker.io/grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_DEFAULT_THEME: "system"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro   # provider の path（provisioning/dashboards/chromium.yml）
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1gb
    depends_on:
      - prometheus

  # Prometheus のために CDP（/json/version）を probe する。Apple Container は Dockerfile の
  # HEALTHCHECK を評価しないので、これが生死の合図になる。
  blackbox:
    image: docker.io/prom/blackbox-exporter:v0.29.1
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    mem_limit: 256mb
