# Chromium startup options (Development · Headful)
#
# One option per line; blank lines and lines starting with # are ignored.
# What each flag does and why, and how to mount a custom .conf:
#   https://uraitakahito.github.io/chromium-server-docker/configuration/chromium-flags/

--remote-debugging-port=9223
--remote-debugging-address=127.0.0.1
--no-first-run
--no-default-browser-check
--disable-background-networking
--disable-dev-shm-usage
--disable-gpu
--no-sandbox
--disable-setuid-sandbox
--password-store=basic
--start-maximized
--disable-blink-features=AutomationControlled
--disable-back-forward-cache
--disk-cache-size=1073741824
--user-data-dir=/tmp/chrome-profile
