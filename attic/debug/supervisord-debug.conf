[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# debug（headful と VNC）のプロセスの木。`priority` が起動の順を決める:
# 最初に X server、次に window manager と VNC の配信、最後に Chromium。
# それでも cold start では、Chromium が Xvfb と競争することがある。
# socket を待つ wrapper を足す代わりに、startretries で自然に回復させる。

[program:xvfb]
command=Xvfb :1 -screen 0 1280x800x24
priority=10
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/tmp/xvfb-stdout.log
stderr_logfile=/tmp/xvfb-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":1"
priority=20
autostart=true
autorestart=true
startsecs=1
startretries=5
stdout_logfile=/tmp/fluxbox-stdout.log
stderr_logfile=/tmp/fluxbox-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

[program:x11vnc]
# -forever: クライアントが切れた後も配り続ける
# -shared : 同時に複数で見られるようにする
# -nopw   : 開発専用の image で、画面に秘密は無い
command=x11vnc -display :1 -rfbport 5901 -forever -shared -nopw
priority=30
autostart=true
autorestart=true
startsecs=1
startretries=5
stdout_logfile=/tmp/x11vnc-stdout.log
stderr_logfile=/tmp/x11vnc-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5901
priority=40
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/tmp/novnc-stdout.log
stderr_logfile=/tmp/novnc-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

[program:chromium]
command=/app/start-chromium.sh
environment=CHROMIUM_CONFIG="/app/chromium-headful.conf",DISPLAY=":1"
priority=50
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/tmp/chromium-stdout.log
stderr_logfile=/tmp/chromium-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
# graceful shutdown の設定
stopsignal=TERM
stopwaitsecs=10
killasgroup=true
stopasgroup=true

# Chrome DevTools Protocol のポートを転送する socat。
# Chromium の --remote-debugging-address=0.0.0.0 は security の理由で無効なので、
# 外からの接続を socat で Chromium の localhost だけのポートへ転送する。
# 参照: https://issues.chromium.org/issues/40261787
[program:socat]
command=socat TCP-LISTEN:9222,reuseaddr,fork TCP:localhost:9223
priority=60
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/tmp/socat-stdout.log
stderr_logfile=/tmp/socat-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
# graceful shutdown の設定
stopsignal=TERM
stopwaitsecs=5
killasgroup=true
stopasgroup=true
