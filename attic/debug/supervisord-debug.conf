[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Debug (headful + VNC) process tree. `priority` orders startup:
# X server first, then the window manager and VNC delivery, Chromium last.
# Chromium may still race Xvfb on a cold start; startretries lets it
# self-heal instead of adding an explicit socket-wait wrapper.

[program:xvfb]
command=Xvfb :1 -screen 0 1280x800x24
priority=10
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/tmp/xvfb-stdout.log
stderr_logfile=/tmp/xvfb-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":1"
priority=20
autostart=true
autorestart=true
startsecs=1
startretries=5
stdout_logfile=/tmp/fluxbox-stdout.log
stderr_logfile=/tmp/fluxbox-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

[program:x11vnc]
# -forever: keep serving after a client disconnects
# -shared : allow several viewers at once
# -nopw   : development-only image; the display carries no secrets
command=x11vnc -display :1 -rfbport 5901 -forever -shared -nopw
priority=30
autostart=true
autorestart=true
startsecs=1
startretries=5
stdout_logfile=/tmp/x11vnc-stdout.log
stderr_logfile=/tmp/x11vnc-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 localhost:5901
priority=40
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/tmp/novnc-stdout.log
stderr_logfile=/tmp/novnc-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

[program:chromium]
command=/app/start-chromium.sh
environment=CHROMIUM_CONFIG="/app/chromium-headful.conf",DISPLAY=":1"
priority=50
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/tmp/chromium-stdout.log
stderr_logfile=/tmp/chromium-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
# Graceful shutdown settings
stopsignal=TERM
stopwaitsecs=10
killasgroup=true
stopasgroup=true

# socat for Chrome DevTools Protocol port forwarding
# Chromium's --remote-debugging-address=0.0.0.0 is disabled for security reasons,
# so we use socat to forward external connections to Chromium's localhost-only port.
# See: https://issues.chromium.org/issues/40261787
[program:socat]
command=socat TCP-LISTEN:9222,reuseaddr,fork TCP:localhost:9223
priority=60
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/tmp/socat-stdout.log
stderr_logfile=/tmp/socat-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
# Graceful shutdown settings
stopsignal=TERM
stopwaitsecs=5
killasgroup=true
stopasgroup=true
