[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:chromium]
command=/app/start-chromium.sh
environment=CHROMIUM_CONFIG="/app/chromium-headless.conf"
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/tmp/chromium-stdout.log
stderr_logfile=/tmp/chromium-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
# Graceful shutdown settings
stopsignal=TERM
stopwaitsecs=10
killasgroup=true
stopasgroup=true

# socat for Chrome DevTools Protocol port forwarding
# Chromium's --remote-debugging-address=0.0.0.0 is disabled for security reasons,
# so we use socat to forward external connections to Chromium's localhost-only port.
# See: https://issues.chromium.org/issues/40261787
[program:socat]
command=socat TCP-LISTEN:9222,reuseaddr,fork TCP:localhost:9223
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/tmp/socat-stdout.log
stderr_logfile=/tmp/socat-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
# Graceful shutdown settings
stopsignal=TERM
stopwaitsecs=5
killasgroup=true
stopasgroup=true

# Prometheus exporters. Both listen on every interface of the container's own
# network namespace; compose does not publish 9100 / 9256 to the host, so they
# are reachable only from inside the container network (Prometheus scrapes them
# by the container's DNS name). Docs:
#   https://uraitakahito.github.io/chromium-server-docker/configuration/metrics/
[program:node-exporter]
# VM / OS level metrics. Collectors are opt-in: the defaults emit ~500 series,
# most of them meaningless inside a single-purpose VM (thermal, hwmon, bonding).
# Inside a Docker container (shared kernel) meminfo/cpu describe the HOST, not
# the container — see the docs page before reading them there.
command=/usr/local/bin/node_exporter --web.listen-address=:9100 --collector.disable-defaults --collector.cpu --collector.meminfo --collector.loadavg --collector.filesystem --collector.netdev --collector.processes
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/tmp/node-exporter-stdout.log
stderr_logfile=/tmp/node-exporter-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
# Graceful shutdown settings
stopsignal=TERM
stopwaitsecs=5
killasgroup=true
stopasgroup=true

[program:process-exporter]
# Per-process-group CPU / RSS / threads / fds, grouped by chromium --type
# (see process-exporter.yml in the repo root).
command=/usr/local/bin/process-exporter -config.path /app/process-exporter.yml -web.listen-address=:9256
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/tmp/process-exporter-stdout.log
stderr_logfile=/tmp/process-exporter-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
# Graceful shutdown settings
stopsignal=TERM
stopwaitsecs=5
killasgroup=true
stopasgroup=true
