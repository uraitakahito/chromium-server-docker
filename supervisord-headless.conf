[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:chromium]
command=/app/start-chromium.sh
environment=CHROMIUM_CONFIG="/app/chromium-headless.conf"
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/tmp/chromium-stdout.log
stderr_logfile=/tmp/chromium-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
# graceful shutdown の設定
stopsignal=TERM
stopwaitsecs=10
killasgroup=true
stopasgroup=true

# Chrome DevTools Protocol のポートを転送する socat。
# Chromium の --remote-debugging-address=0.0.0.0 は security の理由で無効なので、
# 外からの接続を socat で Chromium の localhost だけのポートへ転送する。
# 参照: https://issues.chromium.org/issues/40261787
[program:socat]
command=socat TCP-LISTEN:9222,reuseaddr,fork TCP:localhost:9223
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/tmp/socat-stdout.log
stderr_logfile=/tmp/socat-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
# graceful shutdown の設定
stopsignal=TERM
stopwaitsecs=5
killasgroup=true
stopasgroup=true

# Prometheus の exporter。どちらもコンテナ自身の network namespace の全 interface で待つ。
# compose は 9100 / 9256 を host に publish しないので、届くのはコンテナ network の中からだけ
# （Prometheus はコンテナの DNS 名で scrape する）。docs:
#   https://uraitakahito.github.io/chromium-server-docker/configuration/metrics/
[program:node-exporter]
# VM / OS の値。collector は opt-in にする: 既定のままだと 500 series ほど出て、
# その大半は単一用途の VM の中では意味が無い（thermal・hwmon・bonding）。
# Docker のコンテナの中（kernel を共有する）では、meminfo・cpu はコンテナではなく host を表す ——
# そこで読むなら、先に docs のページを見る。
command=/usr/local/bin/node_exporter --web.listen-address=:9100 --collector.disable-defaults --collector.cpu --collector.meminfo --collector.loadavg --collector.filesystem --collector.netdev --collector.processes
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/tmp/node-exporter-stdout.log
stderr_logfile=/tmp/node-exporter-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
# graceful shutdown の設定
stopsignal=TERM
stopwaitsecs=5
killasgroup=true
stopasgroup=true

[program:process-exporter]
# process の群ごとの CPU・RSS・thread・fd。chromium の --type で群に分ける
# （リポジトリの root の process-exporter.yml を参照）。
# -children=false: どの規則にも当たらない process
# （dbus-run-session・dbus-daemon・起動スクリプト）は、
# いちばん近い当たった祖先に畳み込まれず、単に数えられない。
command=/usr/local/bin/process-exporter -config.path /app/process-exporter.yml -web.listen-address=:9256 -children=false
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/tmp/process-exporter-stdout.log
stderr_logfile=/tmp/process-exporter-stderr.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
# graceful shutdown の設定
stopsignal=TERM
stopwaitsecs=5
killasgroup=true
stopasgroup=true
