name: monitoring

# 開発スタック（docker-compose.yml と monitoring/）は Apple Container で動き、
# GitHub の runner にはそれが無い。だから CI は設定ファイルそのものを確かめる:
# Prometheus の設定と rule は promtool で、blackbox の設定はそれ自身の --config.check で、
# dashboard の JSON は形を、compose のファイルは構文を見る。
# スタックが実際に起きるかは、手元で確かめる（docs: getting-started/monitoring）。
on:
  pull_request:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'monitoring/**'
      - 'bin/**'
      - '.github/workflows/monitoring.yml'

permissions:
  contents: read

jobs:
  config:
    name: Validate monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker-compose.yml と同じ image の版にして、promtool を、
      # これらのファイルを読む Prometheus に揃える。
      # prometheus.yml の rule_files の glob が実行時と同じに解決するように、
      # /etc/prometheus に mount する。
      - name: promtool check config
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool docker.io/prom/prometheus:v3.15.1 \
            check config /etc/prometheus/prometheus.yml
      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool docker.io/prom/prometheus:v3.15.1 \
            check rules /etc/prometheus/rules/chromium.yml
      - name: blackbox config check
        run: |
          docker run --rm -v "$PWD/monitoring/blackbox:/etc/blackbox_exporter:ro" \
            docker.io/prom/blackbox-exporter:v0.29.1 \
            --config.check --config.file=/etc/blackbox_exporter/blackbox.yml
      - name: Dashboard JSON shape
        run: |
          jq -e '.uid == "chromium" and .id == null and (.panels | length) > 0 and (.templating.list | map(.name) | index("instance")) != null' monitoring/grafana/dashboards/chromium.json
      # 構文だけ: Docker Compose と container-compose は、ファイルの形式では一致するが、
      # 意味では一致しない（build.target・service 名と同じ環境変数の値）。
      # だからここが緑でも、bin/stack.sh up の代わりにはならない。
      - name: Compose file syntax
        run: docker compose -f docker-compose.yml config --quiet
