name: docs-site

# docs-site/ の Astro + Starlight の docs を build して、GitHub Pages に公開する。
#   - pull_request: build だけ（読み取りだけの確かめで、deploy はしない）。
#   - release の tag（v*）の push、または tag の上の手動の起動: build して Pages に deploy する。
#     だから公開される docs は、release した版の物になる。main への push では公開しない。
#     github-pages の環境は、v* の tag からの deploy だけを許す
#     （gh workflow run docs-site.yml --ref vX.Y.Z）。
# 最初に 1 回、Settings -> Pages -> Source を "GitHub Actions" にして有効にする。

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'docs-site/**'
      - '.nvmrc'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

# 既定の token は読み取りだけ。deploy の job が自分の権限を上げる。
permissions:
  contents: read

# Pages の deploy を 1 つずつ流す。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npx astro build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    # PR では build の確かめだけを走らせる。公開は、release の tag か手動の起動で行う。
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
