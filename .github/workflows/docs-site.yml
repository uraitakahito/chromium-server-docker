name: docs-site

# Build the Astro + Starlight docs site in docs-site/ and publish it to GitHub Pages.
#   - pull_request: build only (a read-only check; never deploys).
#   - push of a release tag (v*) / manual dispatch on a tag: build + deploy to
#     Pages, so the published docs are those of a released version. A push to
#     main does not publish; the github-pages environment allows deployments
#     from v* tags only (gh workflow run docs-site.yml --ref vX.Y.Z).
# Enable once under Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

# Default token is read-only; the deploy job elevates its own permissions.
permissions:
  contents: read

# Serialize Pages deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npx astro build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    # PRs run the build check only; publishing happens on a release tag / manual dispatch.
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
