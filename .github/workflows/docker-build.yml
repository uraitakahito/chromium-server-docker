name: docker-build

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - 'chromium-*.conf'
      - 'supervisord-*.conf'
      - 'start-*.sh'
      - 'process-exporter.yml'
      - '.github/workflows/docker-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Targets of the single multi-stage docker/Dockerfile. Mothballed
        # units (attic/development/, attic/debug/) are intentionally NOT
        # built here — see the README.md in each attic directory.
        variant: [production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.variant }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64
          push: false
          load: true
          tags: chromium-server-docker:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

  smoke:
    name: CDP smoke test (production)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: production
          platforms: linux/amd64
          push: false
          load: true
          tags: chromium-server-docker:smoke
          cache-from: type=gha,scope=production

      - name: Start container
        run: |
          docker run -d --rm --init --name smoke -p 9222:9222 -p 9100:9100 -p 9256:9256 chromium-server-docker:smoke

      - name: Wait for CDP and verify response
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9222/json/version | grep -q webSocketDebuggerUrl; then
              echo "CDP is up after ${i}s"
              curl -s http://localhost:9222/json/version
              exit 0
            fi
            sleep 1
          done
          echo "CDP did not respond within 30s" >&2
          exit 1
      # The bundled exporters answer on their own ports. chromium-browser is
      # exactly 1 (the parent process); renderers come and go, so only their
      # presence is checked. Renderers may still be spawning right after CDP
      # comes up, so retry for a few seconds. On failure, print what the
      # exporters said and the process list, so the log explains itself.
      - name: Verify the bundled exporters
        run: |
          node=""; procs=""
          for i in $(seq 1 15); do
            node=$(curl -sf http://localhost:9100/metrics | grep '^node_memory_MemTotal_bytes ' || true)
            procs=$(curl -sf http://localhost:9256/metrics | grep '^namedprocess_namegroup_num_procs' || true)
            if [ -n "$node" ] \
              && printf '%s\n' "$procs" | grep -q 'groupname="chromium-browser"} 1$' \
              && printf '%s\n' "$procs" | grep -q 'groupname="chromium-renderer"} '; then
              printf '%s\n' "$node" "$procs"
              echo "exporters answer after ${i}s: node_exporter on :9100, process-exporter on :9256 (browser=1, renderer present)"
              exit 0
            fi
            sleep 1
          done
          echo "exporters did not report the expected lines within 15s" >&2
          printf '%s\n' "--- node_exporter:" "$node" "--- process-exporter:" "$procs"
          docker exec smoke ps -eo pid,ppid,comm,args || true
          exit 1

      - name: Capture logs on failure
        if: failure()
        run: |
          docker logs smoke || true
          docker exec smoke cat /tmp/chromium-stderr.log 2>/dev/null || true
          docker exec smoke cat /tmp/socat-stderr.log 2>/dev/null || true
          docker exec smoke cat /tmp/node-exporter-stderr.log 2>/dev/null || true
          docker exec smoke cat /tmp/process-exporter-stderr.log 2>/dev/null || true

      - name: Stop container
        if: always()
        run: docker rm -f smoke || true
