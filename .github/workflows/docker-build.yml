name: docker-build

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - 'chromium-*.conf'
      - 'supervisord-*.conf'
      - 'start-*.sh'
      - '.github/workflows/docker-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Targets of the single multi-stage docker/Dockerfile. Mothballed
        # units (attic/development/, attic/debug/) are intentionally NOT
        # built here — see the README.md in each attic directory.
        variant: [production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.variant }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.variant }}
          platforms: linux/amd64
          push: false
          load: true
          tags: chromium-server-docker:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max

  smoke:
    name: CDP smoke test (production)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: production
          platforms: linux/amd64
          push: false
          load: true
          tags: chromium-server-docker:smoke
          cache-from: type=gha,scope=production

      - name: Start container
        run: |
          docker run -d --rm --init --name smoke -p 9222:9222 chromium-server-docker:smoke

      - name: Wait for CDP and verify response
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9222/json/version | grep -q webSocketDebuggerUrl; then
              echo "CDP is up after ${i}s"
              curl -s http://localhost:9222/json/version
              exit 0
            fi
            sleep 1
          done
          echo "CDP did not respond within 30s" >&2
          exit 1

      - name: Capture logs on failure
        if: failure()
        run: |
          docker logs smoke || true
          docker exec smoke cat /tmp/chromium-stderr.log 2>/dev/null || true
          docker exec smoke cat /tmp/socat-stderr.log 2>/dev/null || true

      - name: Stop container
        if: always()
        run: docker rm -f smoke || true
