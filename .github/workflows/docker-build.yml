name: docker-build

on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - 'chromium-*.conf'
      - 'supervisord-*.conf'
      - 'start-*.sh'
      - 'process-exporter.yml'
      - 'bin/pin-chromium*.mjs'
      - 'bin/dockerfile-size.test.mjs'
      - '.nvmrc'
      - '.github/workflows/docker-build.yml'

permissions:
  contents: read

jobs:
  # 版を固定する helper（bin/pin-chromium.mjs）の純粋な部分の試験と、
  # docker/Dockerfile の大きさの見張り（bin/dockerfile-size.test.mjs）。
  # snapshot.debian.org と話す部分は、helper そのものを走らせて確かめる
  # （docs: configuration/chromium-version）。
  pin-helper:
    name: Pin helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: node --test 'bin/*.test.mjs'

  # production の image を、動かす両方の arch で build して smoke test する:
  # arm64 は Apple silicon の Apple Container が建てる arch、amd64 は CI とサーバでふつうの arch。
  # どちらも native で動く（ubuntu-24.04-arm は public のリポジトリなら無料）ので、QEMU は使わない。
  # 両方を建てることで、次のことも確かめられる:
  # APT_SNAPSHOT の時点の snapshot が、arch ごとに CHROMIUM_VERSION を載せていること。
  # Debian の security の upload の後の数時間は、2 つの arch で載っている版が食い違うことがある。
  #
  # 凍結ユニット（attic/development/・attic/debug/）は、ここでは意図して build しない ——
  # attic の各ディレクトリの README.md を参照。
  smoke:
    name: Build and smoke-test production (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: production
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: chromium-server-docker:smoke
          cache-from: type=gha,scope=production-${{ matrix.arch }}
          cache-to: type=gha,scope=production-${{ matrix.arch }},mode=max

      - name: Start container
        run: |
          docker run -d --rm --init --name smoke -p 9222:9222 -p 9100:9100 -p 9256:9256 chromium-server-docker:smoke

      - name: Wait for CDP and verify response
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9222/json/version | grep -q webSocketDebuggerUrl; then
              echo "CDP is up after ${i}s"
              curl -s http://localhost:9222/json/version
              exit 0
            fi
            sleep 1
          done
          echo "CDP did not respond within 30s" >&2
          exit 1

      # docker/Dockerfile の固定は、利用者が読む
      # （browserhive のスタックの点検は、自分の /status をこれに照らす）。
      # だから image は、ちょうどその版を答えなければならない:
      # 中では Debian の package の版を、CDP では上流の版を。
      - name: Verify the Chromium version against the pin
        run: |
          pinned="$(sed -n 's/^ARG CHROMIUM_VERSION=\(.*\)$/\1/p' docker/Dockerfile)"
          installed="$(docker exec smoke dpkg-query -W -f="\${Version}" chromium)"
          want="Chrome/${pinned%%-*}"
          got="$(curl -sf http://localhost:9222/json/version | sed -n 's/^ *"Browser": *"\([^"]*\)".*/\1/p')"
          echo "pinned $pinned, installed $installed; CDP reports $got, expected $want"
          [ "$installed" = "$pinned" ] || { echo "dpkg reports chromium $installed, but docker/Dockerfile pins $pinned" >&2; exit 1; }
          [ "$got" = "$want" ] || { echo "CDP reports $got, but docker/Dockerfile pins $want" >&2; exit 1; }

      # build を比べるため: 同じ固定なら、両方の arch でも、建て直すたびでも、
      # 同じ package の版にならなければならない。
      - name: List the installed packages
        run: docker exec smoke dpkg-query -W -f="\${Package} \${Version}\n"

      # 同梱の exporter が、それぞれの口で答える。chromium-browser はちょうど 1（親の process）。
      # renderer は増減するので、居ることだけを見る。
      # CDP が起きた直後は renderer がまだ生まれている途中かもしれないので、数秒やり直す。
      # 失敗したら、exporter の答えと process の一覧を出して、ログだけで事情が分かるようにする。
      - name: Verify the bundled exporters
        run: |
          node=""; procs=""
          for i in $(seq 1 15); do
            node=$(curl -sf http://localhost:9100/metrics | grep '^node_memory_MemTotal_bytes ' || true)
            procs=$(curl -sf http://localhost:9256/metrics | grep '^namedprocess_namegroup_num_procs' || true)
            if [ -n "$node" ] \
              && printf '%s\n' "$procs" | grep -q 'groupname="chromium-browser"} 1$' \
              && printf '%s\n' "$procs" | grep -q 'groupname="chromium-renderer"} '; then
              printf '%s\n' "$node" "$procs"
              echo "exporters answer after ${i}s: node_exporter on :9100, process-exporter on :9256 (browser=1, renderer present)"
              exit 0
            fi
            sleep 1
          done
          echo "exporters did not report the expected lines within 15s" >&2
          printf '%s\n' "--- node_exporter:" "$node" "--- process-exporter:" "$procs"
          docker exec smoke ps -eo pid,ppid,comm,args || true
          exit 1

      - name: Capture logs on failure
        if: failure()
        run: |
          docker logs smoke || true
          docker exec smoke cat /tmp/chromium-stderr.log 2>/dev/null || true
          docker exec smoke cat /tmp/socat-stderr.log 2>/dev/null || true
          docker exec smoke cat /tmp/node-exporter-stderr.log 2>/dev/null || true
          docker exec smoke cat /tmp/process-exporter-stderr.log 2>/dev/null || true

      - name: Stop container
        if: always()
        run: docker rm -f smoke || true
